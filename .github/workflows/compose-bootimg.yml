name: Compose Boot Image (FD + kernel + payload)

# Composes a flashable boot image from:
#   - the firmware volume committed in uefi/SILICIUM_UEFI.fd (built by the
#     Mu-Silicium "Build and upload picasso FD" workflow, copied here manually)
#   - the XNU kernel + ADT payload built here (macOS, xcodebuild)
#   - BootShim / mkbootimg / DTB / FD config from uefi/mu-silicium (committed here)
#
# Produces boot.img ready for "fastboot boot" (or "fastboot flash boot" when the
# payload is sized to fit the boot partition).
# iPhone userland is experimental; successful composition is not runtime qualification.
# Pure host regressions run separately in host-checks.yml.

on:
  workflow_dispatch:
    inputs:
      fast:
        description: Skip optional artifact checks for device iteration
        type: boolean
        default: false
      create_data_seed:
        description: Create the first 20 GiB seed if none is reusable (changes Data identity)
        type: boolean
        default: false
      build_userdata:
        description: Also build and upload the userdata root image (sparse, for fastboot flash userdata)
        type: boolean
        default: false
      raphael_wifi:
        description: Route 2 - build raphael's complete ath10k WiFi stack (replaces self-developed stack)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: picasso-bootimg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso device repo
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check iPhone X inputs and retained kernel backend
        run: |
          python3 scripts/check-picasso-target.py --require-build-inputs \
            --output out/picasso/logs/target-readiness.json --github-env "$GITHUB_ENV"

      - name: Verify firmware volume and DTB are present
        run: |
          test -s uefi/SILICIUM_UEFI.fd || { echo "uefi/SILICIUM_UEFI.fd missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/DTBs/picasso-topology.dtb || { echo "picasso-topology.dtb missing"; exit 1; }
          test -s uefi/mu-silicium/BootShim/BootShim.S || { echo "BootShim.S missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/Scripts/mkbootimg.py || { echo "mkbootimg.py missing"; exit 1; }
          ls -l uefi/SILICIUM_UEFI.fd uefi/mu-silicium/Resources/DTBs/picasso-topology.dtb

      - name: Prepare the isolated upstream source
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Restore the kernel compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xnu-ccache
          key: xnu-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: xnu-ccache-${{ runner.os }}-

      - name: Install host tools and check the SDK
        run: |
          # lld is a separate Homebrew formula now; the llvm bottle no longer
          # ships ld.lld, which the entry-probe patcher needs.
          brew install cmake ninja unifdef llvm lld mtools dtc ccache
          # Kernel compiles go through ccache with the SDK's own clang (not the Homebrew llvm
          # added to PATH below); MakeInc.cmd keeps CC/CXX that come from the environment.
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          for tool in clang clang++; do
            # scripts/ci-ccache-clang.py drops XNU's -MJ (ccache refuses it) except for the one record read later.
            printf '#!/bin/sh\nexec python3 -I "%s" "%s" "$@"\n' "$GITHUB_WORKSPACE/device/scripts/ci-ccache-clang.py" "$(xcrun -sdk iphoneos -find "$tool")" > "$RUNNER_TEMP/ccache-bin/$tool"
            chmod +x "$RUNNER_TEMP/ccache-bin/$tool"
          done
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build the SpringBoard inject library
        run: |
          mkdir -p out/picasso
          python3 scripts/build-picasso-sb-inject.py \
            package/picasso-springboard/picasso-springboard-probe.m out/picasso/libpicasso-sb.dylib

      - name: Prepare authenticated stock touch firmware
        run: |
          python3 scripts/fetch-picasso-touch-firmware.py --output out/picasso/novatek/firmware.bin
          echo "NOVATEK_TOUCH_FW=$PWD/out/picasso/novatek/firmware.bin" >> "$GITHUB_ENV"

      - name: Prepare exact stock Adreno 620 firmware
        run: |
          python3 scripts/fetch-picasso-gpu-firmware.py --output out/picasso/gpu-firmware
          echo "ADRENO620_FW_DIR=$PWD/out/picasso/gpu-firmware" >> "$GITHUB_ENV"
          cp out/picasso/gpu-firmware/firmware.json out/picasso/logs/gpu-firmware.json

      - name: Download the target IPSW
        run: |
          mkdir -p out/ipsw
          IPSW="out/ipsw/$PICASSO_IPSW_FILE"
          HOST=updates.cdn-apple.com
          URL="$PICASSO_IPSW_URL"
          if [ ! -s "$IPSW" ]; then
            if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 30 -o "$IPSW" "$URL"; then
              IP=$(curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['data'] for a in d.get('Answer',[]) if a['type']==1))")
              echo "runner DNS failed; pinning $HOST to $IP"
              curl --fail --retry 5 --retry-all-errors --connect-timeout 30 \
                --resolve "$HOST:443:$IP" -o "$IPSW" "$URL"
            fi
          fi
          python3 scripts/check-picasso-target.py --ipsw "$IPSW"
          ls -lh "$IPSW"
          echo "UNIXNU_IPSW=$PWD/$IPSW" >> "$GITHUB_ENV"

      # The App cryptex holds Safari's WebKit services (WebContent/Networking/GPU);
      # without it a page can never render (measured on device: the XPCServices
      # directory does not exist anywhere and /System/Cryptexes/App is a dangling
      # link).  Print every cryptex/dmg member so the exact name can be pinned.
      - name: List the cryptex members of the IPSW
        run: |
          python3 - "$UNIXNU_IPSW" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if 'Cryptex' in n or n.lower().endswith('.dmg'):
                      print('IPSW_MEMBER', n)
          PY

      # The root volume the ADT's root-matching UUID selects comes from the
      # unchanged OS/SystemOS windows of the target IPSW (docs/guide/userdata).
      # Built here, converted to Android sparse (fastboot's streaming path),
      # and uploaded once; flashing it is a manual, deliberate step.
      - name: Build the userdata root image
        if: ${{ inputs.build_userdata }}
        run: |
          python3 ./unixnu build userdata --ipsw "$UNIXNU_IPSW"
          find out -name 'userdata-root*.img' -o -name 'userdata-root*.json' | xargs ls -l
          python3 scripts/make-android-sparse.py out/picasso/userdata/userdata-root.img out/picasso/userdata/userdata-root.sparse.img
          ls -lh out/picasso/userdata/userdata-root.sparse.img

      - name: Upload the userdata root image
        if: ${{ inputs.build_userdata }}
        uses: actions/upload-artifact@v4
        with:
          name: picasso-userdata-${{ github.run_number }}
          path: device/out/picasso/userdata/userdata-root.sparse.img
          retention-days: 7
          # The sparse image is almost all zero blocks; the default deflate
          # level ships a ~200 MB artifact instead of a 7.4 GB stored one.
          if-no-files-found: error

      # The original static and System trust caches are extracted from the pinned
      # IPSW here rather than committed; board.toml pins the accepted bundle hash.
      - name: Bundle the original trust caches
        run: |
          mkdir -p out/picasso/logs
          python3 ./unixnu ipsw fetch OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee out/picasso/logs/actions-ipsw.log
          python3 scripts/prepare-original-trust.py --tree "$UNIXNU_TREE" --inputs "out/ipsw/$PICASSO_IPSW_BUILD" --output out/picasso/original-static-system.bundle 2>&1 | tee out/picasso/logs/actions-trust.log
          python3 scripts/prepare-picasso-ui-trust.py --original out/picasso/original-static-system.bundle \
            --library out/picasso/libpicasso-sb.dylib --output out/picasso/ui-trust.bundle \
            2>&1 | tee out/picasso/logs/actions-ui-trust.log
          cp out/picasso/ui-trust.json out/picasso/logs/ui-trust.json

      - name: Verify native macOS root disks against the signed policy
        if: ${{ !inputs.fast }}
        run: |
          sudo "$(command -v python3)" scripts/check-picasso-root-inputs.py \
            --inputs "out/ipsw/$PICASSO_IPSW_BUILD" \
            --output out/picasso/logs/root-inputs.json

      - name: Prepare the retained Darwin 23 native kext donor
        run: |
          python3 scripts/prepare-picasso-kernelcache.py --tree "$UNIXNU_TREE" \
            --output "out/ipsw/$PICASSO_BACKEND_BUILD" 2>&1 | tee out/picasso/logs/actions-kernel-donor.log
          cp "out/ipsw/$PICASSO_BACKEND_BUILD/report.json" out/picasso/logs/kernel-donor.json
          echo "UNIXNU_KERNELCACHE=$PWD/out/ipsw/$PICASSO_BACKEND_BUILD/kernelcache.decompressed" >> "$GITHUB_ENV"

      - name: Stage the App cryptex (Safari's WebKit services) for the seed
        run: |
          set +e
          python3 ./unixnu ipsw fetch Cryptex1,AppOS 2>&1 | tee -a out/picasso/logs/actions-ipsw.log
          APP=$(find "out/ipsw/$PICASSO_IPSW_BUILD" -maxdepth 1 -name '*.dmg' -size -20M | head -1)
          echo "APP_CANDIDATE=$APP"
          if [ -z "$APP" ]; then echo "APP_CRYPTEX_MISSING"; exit 0; fi
          echo "--- attach ---"
          hdiutil attach -nomount -readonly "$APP" 2>&1 | tee /tmp/appcryptex-attach.log
          DEV=$(awk '/^\/dev\/disk[0-9]+s[0-9]+/{print $1; exit}' /tmp/appcryptex-attach.log)
          if [ -z "$DEV" ]; then DEV=$(awk '/^\/dev\/disk/{print $1; exit}' /tmp/appcryptex-attach.log); fi
          echo "APP_DEV=$DEV"
          MNT="$RUNNER_TEMP/appcryptex"
          rm -rf "$MNT"; mkdir -p "$MNT"
          mount_apfs -o ro "$DEV" "$MNT" 2>&1 | head -5
          echo "APP_MOUNTED files=$(find "$MNT" -type f | wc -l)"
          if [ ! -e "$MNT/System" ]; then
            echo "APP_CRYPTEX_INCOMPLETE"
            hdiutil detach "$DEV" >/dev/null 2>&1
            exit 0
          fi
          rm -rf out/picasso/app-cryptex
          mkdir -p out/picasso/app-cryptex
          ditto "$MNT" out/picasso/app-cryptex
          echo "APP_CRYPTEX_STAGED files=$(find out/picasso/app-cryptex -type f | wc -l)"
          hdiutil detach "$DEV" >/dev/null 2>&1
          exit 0

      - name: Extract WebKit.framework from the rootfs (it is not in the OS cryptex)
        run: |
          set +e
          DMG="out/ipsw/$PICASSO_IPSW_BUILD/$PICASSO_OS_MEMBER"
          echo "ROOTFS_DMG=$DMG"
          MNT="$RUNNER_TEMP/rootfs"
          rm -rf "$MNT"; mkdir -p "$MNT"
          # Same recipe the seed builder uses; hdiutil mounts the APFS volume,
          # mount_apfs on the raw slice does not.
          hdiutil attach -nobrowse -owners on -readonly -noautofsck -mountpoint "$MNT" "$DMG" 2>&1 | tail -5
          echo "ROOTFS_FILES=$(find "$MNT" -type f 2>/dev/null | wc -l)"
          ls -1 "$MNT" | head -10
          ls -1 "$MNT/System/Library/PrivateFrameworks" 2>/dev/null | head -20
          SRC="$MNT/System/Library/PrivateFrameworks/WebKit.framework"
          echo "ROOTFS_WEBKIT=$(test -d "$SRC" && echo 1 || echo 0)"
          echo "--- what is that path ---"
          ls -ld "$SRC" 2>&1 | head -3
          readlink "$SRC" 2>&1 | head -2
          echo "--- ExtensionKit extensions ---"
          ls -1 "$MNT/System/Library/ExtensionKit/Extensions" 2>/dev/null | head -15
          echo "EXT_COUNT=$(ls -1 "$MNT/System/Library/ExtensionKit/Extensions" 2>/dev/null | wc -l)"
          echo "EXT_WEBKIT=$(ls -1 "$MNT/System/Library/ExtensionKit/Extensions" 2>/dev/null | grep -ci webcontent)"
          echo "--- follow the link, if it resolves inside this mount ---"
          ls -1 "$SRC"/ 2>&1 | head -8
          echo "--- cryptex: same questions ---"
          rm -rf out/picasso/webkit
          if [ -d "$SRC" ]; then
            mkdir -p out/picasso/webkit
            ditto "$SRC" out/picasso/webkit/WebKit.framework
            echo "WEBKIT_STAGED files=$(find out/picasso/webkit -type f | wc -l) KiB=$(du -sk out/picasso/webkit | cut -f1)"
          fi
          hdiutil detach "$MNT" >/dev/null 2>&1
          exit 0

      - name: Inspect the OS cryptex for WebKit content
        run: |
          set +e
          SYS=$(python3 ./unixnu ipsw fetch Cryptex1,SystemOS 2>&1 | grep -v '^$' | tail -1)
          echo "SYS_CANDIDATE=$SYS"
          [ -e "$SYS" ] || { echo "SYS_MISSING"; exit 0; }
          MNT="$RUNNER_TEMP/syscryptex"
          rm -rf "$MNT"; mkdir -p "$MNT"
          hdiutil attach -nobrowse -owners on -readonly -noautofsck -mountpoint "$MNT" "$SYS" 2>&1 | tail -3
          echo "SYS_FILES=$(find "$MNT" -type f 2>/dev/null | wc -l)"
          echo "SYS_LINKS=$(find "$MNT" -type l 2>/dev/null | wc -l)"
          ls -1 "$MNT" | head -10
          echo "--- PrivateFrameworks ---"
          ls -1 "$MNT/System/Library/PrivateFrameworks" 2>/dev/null | head -10
          echo "SYS_WEBKIT_LD=$(ls -ld "$MNT/System/Library/PrivateFrameworks/WebKit.framework" 2>&1 | head -1)"
          echo "--- ExtensionKit ---"
          ls -1 "$MNT/System/Library/ExtensionKit/Extensions" 2>/dev/null | head -15
          hdiutil detach "$MNT" >/dev/null 2>&1
          exit 0

      - name: Find which IPSW image actually carries WebKit
        run: |
          set +e
          python3 - "$UNIXNU_IPSW" <<'PY2'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              for info in z.infolist():
                  if info.filename.lower().endswith('.dmg'):
                      print("IPSW_DMG %s %.1f MiB" % (info.filename, info.file_size / 1048576))
          PY2
          for DMG in $(find "out/ipsw/$PICASSO_IPSW_BUILD" -maxdepth 1 -name '*.dmg' | sort); do
            SZ=$(stat -f%z "$DMG")
            [ "$SZ" -gt 524288000 ] || continue
            echo "=== probe $(basename "$DMG") $(($SZ/1048576))MiB ==="
            MNT="$RUNNER_TEMP/probe-$(basename "$DMG" .dmg)"
            rm -rf "$MNT"; mkdir -p "$MNT"
            hdiutil attach -nobrowse -owners on -readonly -noautofsck -mountpoint "$MNT" "$DMG" 2>&1 | tail -2
            echo "FILES=$(find "$MNT" -type f 2>/dev/null | wc -l)"
            echo "WK_FW=$(ls -ld "$MNT/System/Library/Frameworks/WebKit.framework" 2>&1 | head -1)"
            echo "WK_PF=$(ls -ld "$MNT/System/Library/PrivateFrameworks/WebKit.framework" 2>&1 | head -1)"
            echo "EXT_N=$(ls -1 "$MNT/System/Library/ExtensionKit/Extensions" 2>/dev/null | wc -l)"
            ls -1 "$MNT/System/Library/ExtensionKit/Extensions" 2>/dev/null | head -6
            hdiutil detach "$MNT" >/dev/null 2>&1
          done
          exit 0

      - name: Upload the App cryptex for device-side download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-app-cryptex
          path: device/out/picasso/app-cryptex
          if-no-files-found: warn
      - name: Upload WebKit.framework for device-side download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-webkit-framework
          path: device/out/picasso/webkit
          if-no-files-found: warn


      - name: Reuse persistent Data seed (new seed requires explicit input)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CREATE_DATA_SEED: ${{ inputs.create_data_seed }}
        run: |
          python3 ./unixnu defconfig picasso_defconfig
          SEED_ARGS=()
          if [ "$CREATE_DATA_SEED" = true ]; then SEED_ARGS+=(--allow-new-seed); fi
          python3 scripts/picasso_linux_inputs.py reuse-optional --tree "$UNIXNU_TREE" \
            --output out/picasso/persistent-inputs "${SEED_ARGS[@]}"
          if [ -s out/picasso/persistent-inputs/reuse.json ]; then
            echo "PICASSO_LINUX_INPUTS=$PWD/out/picasso/persistent-inputs" >> "$GITHUB_ENV"
            # Use the signed library bound to the reused Setup seed, then rebuild
            # its precise trust bundle. No new APFS formatting or Setup mutation.
            python3 scripts/prepare-picasso-ui-trust.py --original out/picasso/original-static-system.bundle \
              --library out/picasso/libpicasso-sb.dylib --output out/picasso/ui-trust.bundle
            cp out/picasso/ui-trust.json out/picasso/logs/ui-trust.json
          else
            sudo "$(command -v python3)" scripts/prepare-picasso-ram-data.py \
              --tree "$UNIXNU_TREE" --source "out/ipsw/$PICASSO_IPSW_BUILD/$PICASSO_OS_MEMBER" \
              --output out/picasso/ram-data --config out/picasso/.config \
              2>&1 | tee out/picasso/logs/actions-ram-data.log
          fi

      - name: Stage prebuilt raphael ath10k.o (route 2)
        if: ${{ inputs.raphael_wifi }}
        working-directory: device
        run: |
          # ath10k.o is built by the Linux gate (build-ath10k-test.yml, which
          # has the newer clang that accepts linux-7.0.14's __counted_by).
          # Xcode clang on this macOS runner is too old, so we commit the
          # verified binary rather than rebuild it here. ath10k source is a
          # verbatim copy of raphael and does not change.
          test -s wifi-ath10k/prebuilt/ath10k.o
          mkdir -p build/raphael-wifi
          python3 -c "import struct; d=open('wifi-ath10k/prebuilt/ath10k.o','rb').read(4); assert d==b'\xcf\xfa\xed\xfe', 'not arm64 Mach-O'"
          ls -l wifi-ath10k/prebuilt/ath10k.o

      - name: Build kernel + payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XNU_RAPHAEL_WIFI: ${{ inputs.raphael_wifi && '1' || '0' }}
          UNIXNU_UNIQUE_CHIP_ID: "41a551c0dec0de01"
          CC: ${{ runner.temp }}/ccache-bin/clang
          CXX: ${{ runner.temp }}/ccache-bin/clang++
          CCACHE_DIR: ${{ runner.temp }}/xnu-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,file_stat_matches
          CCACHE_LOGFILE: ${{ runner.temp }}/ccache.log
        run: |
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          mkdir -p out/picasso/logs
          BUILD_ARGS=(kernel payload -j 3 --skip-setup --trust-cache out/picasso/ui-trust.bundle --data-ramdisk out/picasso/ram-data/data.dbrdisk)
          if [ "$XNU_RAPHAEL_WIFI" = 1 ]; then
            # Route 2 two-pass build. The XNU compile record (needed to compile
            # raphael's kernel glue against the exact kernel headers) only
            # exists after a build has run. Pass 1 builds the normal kernel
            # (raphael off) to generate it; then we compile libRaphaelWifi.a;
            # pass 2 relinks with XNU_RAPHAEL_WIFI so force_load picks it up.
            echo "raphael: pass 1 - base build to generate compile record"
            XNU_RAPHAEL_WIFI=0 python3 ./unixnu build "${BUILD_ARGS[@]}" 2>&1 | tee out/picasso/logs/actions-build-pass1.log
            RECORD=out/picasso/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json
            test -f "$RECORD" || { echo "raphael: no compile record after pass 1"; exit 1; }
            echo "raphael: compiling libRaphaelWifi.a against the record"
            ATH10K_TREE="$PWD/out/picasso/tree" ATH10K_DEVICE="$PWD" python3 scripts/build-raphael-wifi.py 2>&1 | tee out/picasso/logs/actions-raphael-archive.log
            test -f out/picasso/tree/build/raphael-wifi/libRaphaelWifi.a || { echo "raphael: archive missing"; exit 1; }
            # unixnu rebuilds out/picasso/tree on every build, so keep the
            # archive in the device checkout (tree-external) and hand its path
            # to the kernel link via the stock XNU_EXTRA_LD_ARCHIVES hook.
            mkdir -p prebuilt
            cp -f out/picasso/tree/build/raphael-wifi/libRaphaelWifi.a prebuilt/
            ATH10K_O="$PWD/wifi-ath10k/prebuilt/ath10k.o"
            RWIFI_A="$PWD/prebuilt/libRaphaelWifi.a"
            export RAPHAEL_ARCHIVES="-Wl,-force_load,$RWIFI_A -Wl,-force_load,$ATH10K_O"
            echo "raphael: pass 2 - relink with raphael stack ($RWIFI_A)"
            # XNU_RAPHAEL_WIFI stays 0 so the baseline's own force_load block
            # (which expects the archive inside the tree) does not double-add.
            XNU_BOOTSTRAP=0 XNU_RAPHAEL_WIFI=0 python3 ./unixnu build "${BUILD_ARGS[@]}" 2>&1 | tee out/picasso/logs/actions-build.log
          else
            python3 ./unixnu build "${BUILD_ARGS[@]}" 2>&1 | tee out/picasso/logs/actions-build.log
          fi
          ccache -sv || true
          # Which options and inputs ccache refuses (the stats only count them).
          grep -hE "unsupported|Multiple input|multiple source" "$RUNNER_TEMP/ccache.log" 2>/dev/null | sed -E 's/^\[[^]]*\] //' | sort | uniq -c | sort -rn | head -20 || true

      - name: Verify raphael WiFi stack is linked in the final kernel
        if: ${{ inputs.raphael_wifi }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kernel = Path('out/picasso/kernel/kernel.macho').read_bytes()
          link_log = Path('out/picasso/logs/kernel.log').read_text(errors='replace')
          checks = [
              ('force_load hook ran', 'raphael: force_load ->' in link_log),
              ('raphael glue traced (LX: %s)', kernel.count(b'LX: %s') >= 1),
              ('ath10k driver linked', kernel.count(b'ath10k') >= 10),
          ]
          for label, passed in checks:
              print(f'{"PASS" if passed else "FAIL"}: {label}')
          failed = [label for label, passed in checks if not passed]
          if failed:
              raise SystemExit('raphael stack missing from final kernel: ' + ', '.join(failed))
          PY

      - name: Verify Data seed, compiled UUID and payload handoff
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-data-artifacts.py --tree out/picasso/tree --work out/picasso \
            --output out/picasso/logs/data-artifacts.json

      - name: Check runtime memory and swap boundaries
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-runtime-memory.py --xnu out/picasso/tree/.cache/xnu-work --output out/picasso/host-checks/runtime-memory
          cp out/picasso/host-checks/runtime-memory/results.json out/picasso/logs/runtime-memory-host.json

      - name: Check display policy against the payload ADT
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-display-policy.py \
            --adt out/picasso/logs/data-artifacts.files/EFI/UniXNU/Payloads/kernel.macho.adt \
            --output out/picasso/host-checks/display-policy-payload
          cp out/picasso/host-checks/display-policy-payload/results.json out/picasso/logs/display-policy-payload.json

      - name: Check iOS 16 registered-port contracts
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-mach-ports.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/mach-ports
          cp out/picasso/host-checks/mach-ports/results.json out/picasso/logs/mach-ports-host-check.json

      - name: Check bounded framebuffer method diagnostics
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-fb-method-trace.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/fb-method-trace
          cp out/picasso/host-checks/fb-method-trace/results.json out/picasso/logs/fb-method-trace.json

      - name: Check iOS 16 framebuffer and IOSurface adapters
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-ios16-surface-abi.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/ios16-surface-abi
          cp out/picasso/host-checks/ios16-surface-abi/results.json out/picasso/logs/ios16-surface-abi.json

      - name: Check native counter microtime conversion
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-microtime.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/microtime
          cp out/picasso/host-checks/microtime/results.json out/picasso/logs/microtime-host-check.json

      - name: Verify software AES provider against the original class ABI
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-aes-artifacts.py --tree out/picasso/tree --work out/picasso \
            --kernelcache "$UNIXNU_KERNELCACHE" --output out/picasso/logs/aes-artifacts.json

      - name: Verify watchdog service policy against the linked native driver
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-watchdog-policy.py --verify \
            --kernelcache "$UNIXNU_KERNELCACHE" --candidate out/picasso/kernel/kernel.macho \
            --native-prelink-dir "$UNIXNU_TREE/kits/XnuPrelink" \
            --output out/picasso/logs/watchdog-policy.json

      - name: Verify CPU GOP display against the original class ABI
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-display-artifacts.py --tree out/picasso/tree --work out/picasso \
            --kernelcache "$UNIXNU_KERNELCACHE" --output out/picasso/logs/display-artifacts.json

      - name: Verify original Sandbox and IOSurface in the prelinked kernel
        if: ${{ !inputs.fast }}
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          kernel = Path('out/picasso/kernel/kernel.macho')
          plan = json.loads(kernel.with_suffix('.json').read_text())
          if hashlib.sha256(kernel.read_bytes()).hexdigest() != plan['candidate_sha256']:
              raise SystemExit('Prelink report does not match kernel.macho')
          for component in ('com.apple.security.sandbox', 'com.apple.kext.AppleMatch', 'com.apple.iokit.IOSurface', 'com.apple.iokit.IOGPUFamily'):
              if component not in plan['components']:
                  raise SystemExit(f'Missing required original component: {component}')
              start = plan['module_entrypoints'][component]['start_va']
              if not any(e['module'] == component and e['segment'] == '__TEXT_EXEC'
                         and e['va'] <= start < e['va'] + e['size'] for e in plan['extents']):
                  raise SystemExit(f'Missing executable module entry: {component}')
              print(f'Prelink includes {component}, start={start:#x}')
          PY

      - name: Export audited iOS16 inputs for Linux builds
        run: |
          python3 scripts/picasso_linux_inputs.py export --tree "$UNIXNU_TREE"

      - name: Compose boot image (BootShim + repo FD + payload as ramdisk)
        run: |
          python3 ./unixnu bootimg \
            --uefi "$GITHUB_WORKSPACE/device/uefi/mu-silicium" \
            --fd "$GITHUB_WORKSPACE/device/uefi/SILICIUM_UEFI.fd" \
            --dtb "$GITHUB_WORKSPACE/device/uefi/mu-silicium/Resources/DTBs/picasso-topology.dtb" \
            --ramdisk "$GITHUB_WORKSPACE/device/out/picasso/payload/payload.img" \
            -o "$GITHUB_WORKSPACE/device/out/picasso/boot/boot.img" \
            2>&1 | tee out/picasso/logs/bootimg.log
          ls -lh out/picasso/boot/boot.img

      - name: Add raphael BDF boot argument to boot.img (route 2)
        if: ${{ inputs.raphael_wifi }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image = Path('out/picasso/boot/boot.img')
          data = image.read_bytes()
          old, new = b'offline-hid-swipe=8', b'wifi_bdf=bdwlan.bin'
          if len(old) != len(new):
              raise SystemExit(f'length mismatch: {len(old)} vs {len(new)}')
          start = data.find(b'args = "-v')
          end = data.find(b'"', start + 9) if start >= 0 else -1
          if start < 0 or end < 0 or old not in data[start:end]:
              raise SystemExit('offline-hid-swipe=8 not found in the boot image cmdline')
          line = data[start:end].replace(old, new, 1)
          image.write_bytes(data[:start] + line + data[end:])
          print(f'boot.img cmdline: {old.decode()} -> {new.decode()} (length unchanged)')
          PY

      # A few MiB of packed seeds must outlive the disposable kernel artifacts.
      # If all copies become unavailable, reuse fails instead of formatting APFS.
      - name: Retain the exact Data seed independently
        uses: actions/upload-artifact@v4
        with:
          name: picasso-data-seed-${{ github.run_number }}
          path: device/out/picasso/linux-inputs/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload boot image, diagnostic kernel, reports and reusable inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-bootimg-${{ github.run_number }}
          include-hidden-files: true
          # Keep the diagnostic kernel and exact reusable seeds. Raw audit Data
          # copies (.cdr), extracted payload trees and object files stay on runner.
          path: |
            device/out/picasso/boot/**
            device/out/picasso/kernel/kernel.macho
            device/out/picasso/kernel/*.json
            device/out/picasso/kernel/SHA256SUMS
            device/out/picasso/payload/*.json
            device/out/picasso/logs/**/*.log
            device/out/picasso/logs/**/*.json
            device/out/picasso/logs/**/*.txt
            device/out/picasso/host-checks/**/*.json
            device/out/picasso/host-checks/**/*.log
            device/out/picasso/tree/build/**/*.json
            device/out/picasso/tree/build/**/*.log
            device/out/picasso/novatek/*.json
            device/out/picasso/ram-data/*.json
            device/out/picasso/linux-inputs/**
            device/out/picasso/.config
            !device/out/picasso/logs/**/*.files/**
            !device/out/picasso/logs/**/*.cdr
          if-no-files-found: warn
          retention-days: 7
