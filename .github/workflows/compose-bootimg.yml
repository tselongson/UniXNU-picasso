name: Compose Boot Image (FD + kernel + payload)

# Composes a flashable boot image from:
#   - the firmware volume committed in uefi/SILICIUM_UEFI.fd (built by the
#     Mu-Silicium "Build and upload picasso FD" workflow, copied here manually)
#   - the XNU kernel + ADT payload built here (macOS, xcodebuild)
#   - BootShim / mkbootimg / DTB / FD config from uefi/mu-silicium (committed here)
#
# Produces boot.img ready for "fastboot boot" (or "fastboot flash boot" when the
# payload is sized to fit the boot partition).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picasso-bootimg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso device repo (test branch, carries uefi/)
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify firmware volume and DTB are present
        run: |
          test -s uefi/SILICIUM_UEFI.fd || { echo "uefi/SILICIUM_UEFI.fd missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/DTBs/picasso.dtb || { echo "picasso.dtb missing"; exit 1; }
          test -s uefi/mu-silicium/BootShim/BootShim.S || { echo "BootShim.S missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/Scripts/mkbootimg.py || { echo "mkbootimg.py missing"; exit 1; }
          ls -l uefi/SILICIUM_UEFI.fd uefi/mu-silicium/Resources/DTBs/picasso.dtb

      - name: Prepare the isolated upstream source
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Install host tools and check the SDK
        run: |
          # lld is a separate Homebrew formula now; the llvm bottle no longer
          # ships ld.lld, which the entry-probe patcher needs.
          brew install cmake ninja unifdef llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # A full kernel build here costs about twenty minutes, and almost all of it repeats work the
      # previous run already did. The object directory, the archives built from it and the linked
      # kernel are cached so a rerun only rebuilds what changed. The key carries the run id so every
      # run saves, and restore-keys takes the newest matching entry.
      - name: Restore the build tree
        uses: actions/cache/restore@v4
        with:
          path: |
            device/out/picasso/tree/build
            device/out/picasso/kernel
            device/out/picasso/payload
          key: picasso-build-${{ github.run_id }}
          restore-keys: |
            picasso-build-

      - name: Download the target IPSW
        run: |
          mkdir -p out/ipsw
          IPSW=out/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
          HOST=updates.cdn-apple.com
          URL="https://$HOST/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          if [ ! -s "$IPSW" ]; then
            if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 30 -o "$IPSW" "$URL"; then
              IP=$(curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['data'] for a in d.get('Answer',[]) if a['type']==1))")
              echo "runner DNS failed; pinning $HOST to $IP"
              curl --fail --retry 5 --retry-all-errors --connect-timeout 30 \
                --resolve "$HOST:443:$IP" -o "$IPSW" "$URL"
            fi
          fi
          ls -lh "$IPSW"
          echo "UNIXNU_IPSW=$PWD/$IPSW" >> "$GITHUB_ENV"

      - name: Generate the verified-root policy from the userdata image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: "41a551c0dec0de01"
        run: |
          # build-arm-driver.py builds NativeUfs with an embedded VerifiedRoot policy and stops with
          # "run scripts/build-picasso-verified-policy.py first" when it is absent. The policy is
          # derived from the SHNGROOT userdata image, which is itself a build product, so the image
          # has to exist before the kernel build: assemble the tree, build only the userdata step,
          # write the policy into the tree the archives read, then let the kernel build run.
          python3 ./unixnu defconfig picasso_defconfig
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          python3 ./unixnu tree
          python3 ./unixnu build userdata -j 3
          # The kit lives in the assembled tree, not in the device repo, so the signer path is given
          # explicitly -- the default points at device/kits/VerifiedRoot, which does not exist.
          python3 ./scripts/build-picasso-verified-policy.py \
            --image out/picasso/userdata/userdata-root.img \
            --verified-root out/picasso/tree/kits/VerifiedRoot \
            --output out/picasso/tree/build/verified-root-picasso
          ls -l out/picasso/tree/build/verified-root-picasso

      - name: Build kernel + payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: "41a551c0dec0de01"
        run: |
          python3 ./unixnu defconfig picasso_defconfig
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          mkdir -p out/picasso/logs
          # First pass: the shim derives slot addresses from out/picasso/kernel/kernel.macho, and the
          # display archive needs build/native-prelink candidates, while the kernel cannot link until
          # both exist. Stand-ins and a smaller archive list let this pass link a kernel; the prelink
          # step inside it then produces the candidates. That kernel is never booted.
          sed -i '' 's|"build-sheng-platform-power.py"|"build-arm-driver.py ShengPlatformPower"|' board.toml
          sed -i '' '/"build-arm-driver.py NativeLegacyDisplay"/d' board.toml
          sed -i '' 's|^CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y|# CONFIG_XNU_NATIVE_LEGACY_DISPLAY is not set|' configs/picasso_defconfig
          python3 ./unixnu defconfig picasso_defconfig
          python3 ./unixnu build kernel -j 3 2>&1 | tee out/picasso/logs/pass1.log \
            || echo "first pass did not finish; it exists to produce the kernel and the candidates"
          git checkout -- board.toml
          # The first pass linked, and a completed link prunes the object files it no longer needs.
          # The archive steps of the second pass run nm over those objects, so the object directory is
          # cleared to make that pass compile them again. out/picasso/kernel/kernel.macho is outside
          # it and stays, which is what the shim reads.
          git checkout -- configs/picasso_defconfig
          # The display stand-in has to exist before the kernel script tests for it, and it is built
          # from the compile record the first pass left behind -- so it comes before the object
          # directory is cleared, not after.
          ( cd out/picasso/tree && python3 scripts/build-arm-driver.py NativeLegacyDisplay )
          rm -rf out/picasso/tree/build/xnu/ios-obj

          # The Data seed: 8 GiB, packed, with the /private/var skeleton the boot tasks expect, and
          # its volume UUID written into the defconfig so the kernel can find it. board.toml asks for
          # a packed seed (packed_data_ramdisk = true) and sheng-data-persist=2 writes changed pages
          # through the NativeUfs store, so the size is bounded by the packed image, not by RAM.
          DMG=$(find out -name '044-76040-038.dmg' | head -1)
          python3 ./scripts/make-data-seed.py --tree out/picasso/tree --gib 8 \
            --output out/picasso/data-seed.dbr --defconfig configs/picasso_defconfig \
            ${DMG:+--os-dmg "$DMG"}
          python3 ./unixnu defconfig picasso_defconfig

          # Second pass: the real archives, now that both inputs exist.
          python3 ./unixnu build kernel payload -j 3 --data-ramdisk out/picasso/data-seed.dbr 2>&1 \
            | tee out/picasso/logs/actions-build.log

      # Saved even when the build fails, which is when it matters: the objects and archives a failed
      # run produced are exactly what the next attempt would otherwise rebuild from scratch.
      - name: Save the build tree
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            device/out/picasso/tree/build
            device/out/picasso/kernel
            device/out/picasso/payload
          key: picasso-build-${{ github.run_id }}

      - name: Report kernel/payload sizes
        run: |
          ls -l out/picasso/kernel/kernel.macho out/picasso/payload/payload.img
          python3 - <<'EOF'
          import struct
          from pathlib import Path
          k = Path('out/picasso/kernel/kernel.macho')
          if k.is_file():
              d = k.read_bytes()
              print('kernel.macho', len(d), 'bytes')
              # Count segments and report the file size of each one.
              ncmds = struct.unpack_from('<I', d, 16)[0]
              off = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', d, off)
                  if cmd == 0x19:
                      name = d[off+8:off+24].rstrip(b'\0').decode('latin1', 'replace')
                      vmaddr, vmsize, fileoff, filesize = struct.unpack_from('<QQQQ', d, off+24)
                      print(f'  seg {name:20s} filesize={filesize}')
                  off += size
          p = Path('out/picasso/payload/payload.img')
          if p.is_file():
              print('payload.img', p.stat().st_size, 'bytes')
          EOF

      - name: Compose boot image (BootShim + repo FD + payload as ramdisk)
        run: |
          python3 ./unixnu bootimg \
            --uefi "$GITHUB_WORKSPACE/device/uefi/mu-silicium" \
            --fd "$GITHUB_WORKSPACE/device/uefi/SILICIUM_UEFI.fd" \
            --dtb "$GITHUB_WORKSPACE/device/uefi/mu-silicium/Resources/DTBs/picasso.dtb" \
            --ramdisk "$GITHUB_WORKSPACE/device/out/picasso/payload/payload.img" \
            -o "$GITHUB_WORKSPACE/device/out/picasso/boot/boot.img" \
            2>&1 | tee out/picasso/logs/bootimg.log
          ls -lh out/picasso/boot/boot.img

      - name: Upload boot image + kernel + payload + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-bootimg-${{ github.run_number }}
          path: |
            device/out/picasso/boot/**
            device/out/picasso/kernel/**
            device/out/picasso/payload/**
            # The userdata image carries the OS and SystemOS windows the kernel mounts, and its
            # verified-root policy is derived from exactly this image. Without it on the device the
            # kernel has nothing that matches the policy and stops before the console comes up.
            device/out/picasso/userdata/**
            device/out/picasso/logs/**
          if-no-files-found: warn
          retention-days: 7