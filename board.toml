# Board description of the Redmi K30 5G (picasso, SM7250), read by the unixnu build driver.
# Minimal skeleton to build the UniXNU UEFI firmware. Kernel/IPSW/UserData sections are
# placeholders to be filled during kernel bring-up.

[board]
name = "picasso"
soc = "SM7250"
description = "Redmi K30 5G"
kit = "picasso"

# Target OS image. PLACEHOLDER   select an IPSW whose ARM version is compatible with
# SM7250 (ARMv8.2 / Cortex-A76). Only needed for the kernel step, not for firmware.
[ipsw]
# Same unchanged iPad7,1 iPadOS 17.7.11 image uke (SM7675) and sheng (SM8550) use.
# SM7250 (ARMv8.2 / Cortex-A76) is instruction-compatible with this kernel source.
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]

# UserData partition geometry (GPT entry "userdata" of LUN 0), measured on this board.
[userdata]
# Measured on the device through Android (Magisk root), not guessed:
#   /sys/class/block/sda34/start = 23068672   (512-byte sectors)
#   /sys/class/block/sda34/size  = 224485336  (512-byte sectors, 114936492032 bytes)
#   logical_block_size = 4096, so first = 23068672/8 = 0x2C0000 and the partition spans
#   28060667 blocks of 4096 bytes.
first_lba = 0x2C0000
last_lba = 0x1D82BFA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Kernel configuration. PLACEHOLDER for kernel bring-up.
[kernel]
defconfig = "picasso_defconfig"
# First-console archives: only what the minimal picasso_defconfig selects
# (corecrypto, ArmDTPlatform, ArmCpu, arch timer). UFS / VirtIO / display /
# Adreno are added in later stages once the platform reaches the console:
# configs/picasso_platform_defconfig lists the stage-6 draft, and its archives
# would be "build-libpthread-kernel.py", "build-arm-driver.py NativeUfs" and
# "build-arm-driver.py NativeAdreno" appended below.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  # Stage 6: the UFS controller driver. Its board constants (GccUfs.h) carry
  # the SM7250 physical windows; the ADT ufshc/ufsphy nodes only match classes.
  "build-arm-driver.py NativeUfs",
  # Publishing the root device needs IOBlockStorageDevice, and the prelinked kernel
  # carries the class dispatch in IOStorageFamily without binding the calls the driver
  # makes: probe=12 jumped to IOBlockStorageDevice's constructor and executed zeroes.
  # Same remedy as udon: extract the original dispatch from the kernel image and bind
  # its addresses as absolute symbols.
  "build-picasso-ufs-bindings.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = ""
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  # load_init_program reads /sbin/launchd, which is decmpfs-compressed. Without this kext the
  # decompressor table has no entry for the type, decmpfs_read_compressed returns 45, and
  # load_init_program fails with errno 45 -- after everything else has succeeded.
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kec.pthread",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
]

# Firmware step: build the picasso Mu-Silicium UEFI firmware via unixnu.
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 1
# The ABL loads kernel + ramdisk into one buffer that starts at abl_base
# (0xB4513000 on this device, derived from the observed initrd address) and ends
# at 0xB7E00000, so the whole payload window is about 57 MiB. With the default
# ramdisk_offset of 0x1000000 the ramdisk starts at 0xB5513000 and only 42.6 MiB
# fit, which truncated the 120 MiB payload: the FAT volume claimed 120 MiB while
# only the first 42.9 MiB were in memory, and FatPkg faulted at 0xB7BFE000.
# 0x200000 puts the ramdisk right after the ~2.1 MiB kernel slot, leaving 54.8 MiB.
ramdisk_offset = 0x200000
[firmware]
config = "picasso"                   # Resources/Configs/picasso.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/picassoPkg/picasso.dsc"
fd = "Build/picassoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
# Openssl submodule is required by Silicon/Silicium OpensslPkg (same as sheng and the
# stock picasso DeviceBuild.py RequiredSubmodules).
submodules = ["Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Full set aligned with sheng so SecureBootHandler.c and other #if-gated code compile
# (ENABLE_SECUREBOOT must be 0/1, not empty, or '#if ENABLE_SECUREBOOT == 1' is a syntax error).
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "picasso"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "picasso-research"

# Payload: a FAT volume with UniXNU config + kernel + ADT. Loader (DarwinBoot) is in the firmware.
[payload]
volume = "PICASSOESP"
size_mib = 54
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"
# serial=3 was dead weight here and could stall early boot: pe_serial.c only
# registers PI3_UART, APPLE_UART, DOCKCHANNEL_UART and VMAPPLE_UART. SM7250 is a
# Qualcomm GENI UART, so serial_init() returns 0 and PE_kputc falls back to
# console_write_unbuffered -> vcputc_options, which is a no-op until the IOKit
# video console binds the framebuffer. Asking for serial output therefore bought
# nothing and left the boot without a console. debug=0x14e keeps DB_KPRT (0x8),
# so kprintf is still enabled; the flags are 0x2 and 0x4 (NMI) plus 0x40 (ARP)
# and 0x100 (obsolete), none of which halt early.
# Also pin the platform explicitly: cpus=1 avoids spinning up seven secondary
# cores before the platform expert has an interrupt controller.
kernel_args = [
  "-v",
  "debug=0x14e",
  "cpus=1",
  "native-ufs-probe=12",
  # No native-ufs-start-delay or native-ufs-delay-yield here. Both exist to hold the UFS bring-up
  # back so a diagnostic session has a complete console first, and with them set startRoot now
  # returns right after "stage NOP OUT" without issuing a single transfer -- the controller never
  # publishes. Without them the same probe=12 path reads the volume and APFS mounts it.
  "native-ufs-diagnostics=1",
  # Without these XNU panics at serial_console.c:175, and IOLib.cpp asserts, whenever an early
  # kernel path logs with interrupts disabled -- which is exactly when the interesting messages
  # happen. Nothing reaches the console without them.
  "nointr_consio=1",
  "nointr_iolog=1",
  # The root volume mounts but the kernel then refuses to continue:
  #   is_root_hash_authentication_required:555: Root Volume, root hash authentication is required
  # This switch exists in the kernel for exactly that check. It is the same class of decision as
  # amfi_get_out_of_my_way: a diagnostic boot on a device that has no Apple boot chain to supply the
  # authenticator. Without it the boot stops at the mount, so it is worth one build to see how far
  # the rest of the stack gets.
  "allow-root-hash-mismatch",
  # AMFI rejects launchd with "unsuitable CT policy 0 for this platform/device" and then kills
  # pid 1, which XNU turns into an "unexpected SIGKILL of launchd" panic. amfi_get_out_of_my_way
  # did not cover this and neither did clearing amfi-only-platform-code, so both were wrong guesses.
  # amfi_allow_any_signature is the switch that speaks to signature acceptance itself.
  "amfi_allow_any_signature=1",
  # launchd starts and then the console goes quiet after its ignition argument dump. Silence there
  # is ambiguous: launchd logs to the system log rather than the kernel console, so a quiet console
  # can mean either "stuck" or "working". boot-progress makes the boot stages print, which separates
  # those two before spending effort on the Data volume.
  "boot-progress=2",
  "io=0x232",
  # smmu=6 programs the SMMU route itself and logs the plan; reset=pshold returns to fastboot after
  # a panic.
  #
  # hold must stay 0. picasso_usb_park() is an infinite loop that polls the console and pets the
  # watchdog, so hold=1 parks the kernel inside bsd_init for good: that is the mode upstream uses
  # to keep a diagnostic session alive, and it is why this image produced the console banner and
  # then nothing at all. With hold=0 bsd_init returns and the boot continues.
  "picasso_usb=2",
  "picasso_usb_smmu=6",
  "picasso_usb_hold=0",
  "picasso_usb_reset=pshold",
]
# Stage-5 blind-spot instrumentation (docs/zh/guide/debugging.md 颜色条):
# scripts/patch-xnu-entry-probe.py (ported from UniXNU-sheng; it adapts itself
# to this kernel via the symbol table) paints a blue bar at the kernel entry,
# a magenta bar just before the MMU comes on, and reboots the device via PSCI
# SYSTEM_RESET entry_probe_reset_delay seconds after the MMU is enabled --
# a spontaneous reboot after that delay is the signal that start.s completed.
# panic_screen redirects panic() to a renderer that draws on the kernel's own
# framebuffer mapping, so any panic after PE_create_console becomes readable.
# Bisect deeper with entry_probe_reset_after (one call per run; payload.py keys
# map to the script's --reset-after/--in/--occurrence options).
# Bisect log (2026-10-24), one probe per run; ~6 s reboot = the call completed:
#   run 1  after-MMU        -> reboot : start.s complete (genuine: cave 16-aligned)
#   run 2  _arm_vm_init     -> VOID   : tight-packing bug (below) made cave4 bl
#   run 3  _PE_create_console -> VOID   : land at callee-4 (previous function tail)
#   run 4  _PE_init_platform #2 -> hang + panic text: the miswired bl landed on
#         PE_slide_devicetree's `bl .cold` tail = exactly the observed
#         "pe_init.c:418 Assertion failed: PE_state.initialized". The text
#         itself proves PE_create_console/PE_init_printf/cpu_machine_idle_init
#         all completed (those calls were untouched).
#   run 5  same target, caves 16-aligned -> ~6 s reboot: the real second
#         PE_init_platform (pe_arm_init_interrupts, GIC MMIO 0x17A00000)
#         completed. Transitively proves arm_vm_init, PE_create_console,
#         PE_init_printf (runs 2/3 were void; the flow covers them).
#         panic screen now reports lr=/PEini=/fb= and mirrors the message
#         to the /pram region: dump-picasso-panic.py --fastboot --paddr 0xB7F00000.
#   run 6  _fiq_context_init #1 -> ~6 s reboot: ml_map_cpu_pio, cpu_timebase_init,
#         kptimer_curcpu_up, PE_init_cpu all complete; arm_init is at its tail.
#   run 7  _vm_mem_bootstrap in _kernel_bootstrap -> ~6 s reboot, no text:
#         kernel_bootstrap runs and vm_mem_bootstrap completes. The missing
#         version line is BY DESIGN: printf goes to vcputc_options, which is
#         gated on gc_enabled, and the screen is only acquired at
#         kPEAcquireScreen (startup.c) -- in _kernel_bootstrap_thread, after
#         PE_init_iokit, the EARLY_BOOT startup phase and spllo(). Early boot
#         is console-less on a board without the display driver, exactly as
#         the earlier note about pe_serial predicted.
#   run 8  _initialize_screen in _kernel_bootstrap_thread -> ~6 s reboot, no
#         wipe: PE_init_iokit (prelinked kexts), EARLY_BOOT and spllo() all
#         passed. No wipe is by design: v_display=1 puts the boot in graphics
#         mode, so kPEAcquireScreen calls gc_enable(FALSE) and the console
#         stays off -- fixed by the vendored DarwinBoot in UniXNU-picasso
#         (drivers/DarwinBoot, v_display = 0 = text console from acquire on).
#   run 9  FREE RUN -> the text console came up and the kernel log scrolled;
#         first visible panic: kern_trustcache.c:477 "amfi interface not
#         available" (lr=_trust_cache_runtime_init.cold.3). The AMFI
#         interface is registered by the early security initializer that
#         emit_prelink records per board; picasso left it empty.
#   run 10 early_security_init: the same pinned iPad7,1 kernelcache as sheng,
#         so the ORIGINAL_VA of AMFI's initializer is identical
#         (0xFFFFFFF005AB4AE0, prelink/kext region below the kernel text);
#         emit_prelink slides it into our coalesced segments (-0x1000000,
#         uniform) and the runtime adds vm_kernel_slide (0 on picasso).
#         (First attempt put the key in [payload] where nothing read it --
#         the panic repeated; fixed in a4a1162 and the panic advanced.)
#   run 11 result: trust_cache_init PASSED (AMFI registered) -- the kernel
#         advanced to pthread_shims.c:318 "pthread kernel extension not
#         loaded". picasso_defconfig keeps CONFIG_XNU_SOURCE_PTHREAD unset,
#         so the pthread shims need the libpthread KEXT from the kernelcache
#         (sheng instead builds pthread from source). The kernelcache's kext
#         is com.apple.kec.pthread (libpthread's kext.xcconfig MODULE_NAME;
#         "com.apple.kec.libpthread" does not exist and fails the closure);
#         its pthread_kext_register call fills the function table.
panic_screen = true

[payload.adt]
tool = "scripts/make-picasso-adt.py"
chip_id = "7250"
# Without this XNU waits for an IOMedia whose Content is Apple_HFS, but publishing volume media is
# the container scheme's job and that scheme never attaches -- so the wait can never be satisfied.
# Matching by UUID is the reference mechanism: XNU asks for this UUID, APFS mounts the container to
# answer, and the volume comes up as media in the process.
#
# Read out of the userdata image rather than guessed, by work/read-apfs-uuid.py:
#   SHNGROOT -> OS window -> protective MBR -> GPT header -> container -> APSB (offset 0xf0).
# All six APSB checkpoints in the OS container carry the same value.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# DarwinBoot requests one contiguous window of this size from the firmware and
# hands it to the kernel as boot_args.memSize. The kernel then builds its physmap
# over exactly that range, so the window has to fit inside a single
# conventional-memory run.
#
# 0x100000000 (4 GiB) cannot fit here. The first DRAM bank is
# 0x80000000..0xBCC00000 (972 MiB) per the device DT, and picassoPkg's
# MemoryMapLib exposes only the "Boot Ramdisk Gap" 0xAD000000..0xBCC00000 as
# SYS_MEM (252 MiB). DarwinBoot still reports success at 4 GiB because
# AllocatePages only records the range as owned, but arm_vm_init() then builds a
# 4 GiB physmap starting at the window base 0xC007C000, which runs past the end
# of real DRAM to 0x1C007C000. Touching that faults with the MMU already on and
# no console bound yet -- the silent hang after the green bar.
#
# 256 MiB is DarwinWindowSizeValid()'s minimum (0x10000000..0x200000000 in 2 MiB
# steps) and fits inside the 252 MiB SYS_MEM run.
owned_memory_size = "0x10000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
unique_chip_id = "required"
